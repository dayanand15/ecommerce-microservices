spring.application.name=inventory-service

spring.config.import=configserver:http://localhost:8888
eureka.client.service.defaultZone=http://localhost:8761/eureka


logging.pattern.console="%d{yyyy-MM-dd HH:mm:ss} [%X{traceId}] %-5level %logger{36} - %msg%n"

spring.kafka.bootstrap-servers=localhost:9092

# Group-id
spring.kafka.consumer.group-id=inventory-group

#Read old messages if no offset exists
spring.kafka.consumer.auto-offset=earliest

#Converts JSON back into OrderCreatedEvent
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=*
spring.kafka.consumer.properties.spring.json.type.headers=false
spring.kafka.consumer.properties.spring.json.value.default.type=com.deen.inventory_service.dto.OrderCreatedEvent